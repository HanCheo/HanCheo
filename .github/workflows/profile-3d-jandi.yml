name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned profile generator
        uses: actions/checkout@v4
        with:
          repository: HanCheo/github-profile-3d-contrib
          ref: 7e3d91d9c7e8608f811496c0c8d9ede321aee684
          path: .profile-3d-generator
      - name: Apply all-language renderer
        run: git -C .profile-3d-generator apply "$GITHUB_WORKSPACE/.github/profile-3d-all-languages.patch"
      - name: Build profile generator
        working-directory: .profile-3d-generator
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm ci && npm run build
      - name: Generate profile charts
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node .profile-3d-generator/dist/index.js "$USERNAME"
      - name: Remove temporary generator checkout
        if: always()
        run: rm -rf .profile-3d-generator
      - name: Commit & Push
        run: |
          git config user.name Moby
          git config user.email 05.hanch.it@gmail.com
          git add -A .
          git commit -m "generated"
          git push
